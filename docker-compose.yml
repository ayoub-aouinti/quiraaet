services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: qiraat
      POSTGRES_USER: qiraat
      POSTGRES_PASSWORD: qiraat
    ports:
      - "5440:5432"   # 5440 côté hôte pour ne pas heurter un Postgres local sur 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiraat -d qiraat"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://qiraat:qiraat@db:5432/qiraat
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
